name: resolve corpus request

# Fills a gap on demand: resolve a query the corpus does not cover, admit it as a real pack
# through the grower's own writer, and commit. The next `publish api` run serves it.
#
# TRIGGER IS MAINTAINER-GATED BY CONSTRUCTION. Applying a label requires write or triage
# access, so a drive-by issue cannot start a job — anyone may ASK by opening an issue, but
# only a maintainer labelling it `corpus-request` spends a runner on it.
#
# Cost: GitHub Actions is free with no minute cap on public repositories, and the guard
# below refuses to run at all if this repo is ever made private.

on:
  workflow_dispatch:
    inputs:
      query:
        description: search phrase, or an absolute http(s) url
        required: true
      tags:
        description: comma-separated tags for the new pack (blank = derived from the query)
        default: ""
      admit:
        description: write the result into packs/ and commit
        type: boolean
        default: true
  issues:
    types: [labeled]

concurrency:
  group: resolve-request
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  resolve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'corpus-request'
    runs-on: ubuntu-latest
    steps:
      - name: refuse to run if the repo is not public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis="$(gh api "repos/${{ github.repository }}" --jq .visibility)"
          echo "repository visibility: $vis"
          if [ "$vis" != "public" ]; then
            echo "::error::${{ github.repository }} is '$vis'. Actions is only free for" \
                 "public repositories, so this workflow refuses to run and bill." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # An issue title is untrusted input, so it never reaches the shell as text — it goes
      # through the environment and is read by Python as a plain argument.
      - name: resolve the request
        id: run
        env:
          RAW_QUERY: ${{ github.event_name == 'workflow_dispatch' && inputs.query || github.event.issue.title }}
          RAW_TAGS: ${{ inputs.tags }}
          ADMIT: ${{ github.event_name == 'issues' && 'yes' || (inputs.admit && 'yes' || 'no') }}
        run: |
          # strip a leading "corpus-request:" prefix if the issue title carries one
          QUERY="$(printf '%s' "$RAW_QUERY" | sed -E 's/^[[:space:]]*corpus[- ]request:[[:space:]]*//I')"
          echo "query: $QUERY"
          ARGS=(resolve "$QUERY" --quiet)
          [ "$ADMIT" = "yes" ] && ARGS+=(--admit)
          [ -n "$RAW_TAGS" ] && ARGS+=(--tags "$RAW_TAGS")
          set +e
          python -m ragpull "${ARGS[@]}" > resolution.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          e = json.load(open("resolution.json", encoding="utf-8"))
          adm = (e.get("admission") or {})
          print(f"resolved_by={e.get('resolved_by')}")
          print(f"results={len(e.get('results') or [])}")
          print(f"admitted={adm.get('admitted') or ''}")
          print(f"why={adm.get('why') or e.get('note','')[:180]}")
          PY

      - name: commit the new pack
        if: steps.run.outputs.admitted != ''
        run: |
          git config user.name  "nl-rag"
          git config user.email "nl-rag@users.noreply.github.com"
          git add packs atlas.json
          git commit -m "corpus: admit ${{ steps.run.outputs.admitted }} (resolved on request)"
          git push

      - name: report back on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.run.outputs.admitted }}" ]; then
            BODY="Resolved and admitted as \`packs/${{ steps.run.outputs.admitted }}\`. The next \`publish api\` run will serve it."
          else
            BODY="Could not admit this. resolved_by=\`${{ steps.run.outputs.resolved_by }}\`, usable documents=\`${{ steps.run.outputs.results }}\`. Reason: ${{ steps.run.outputs.why }}"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$BODY"

      - uses: actions/upload-artifact@v4
        with:
          name: resolution
          path: resolution.json
